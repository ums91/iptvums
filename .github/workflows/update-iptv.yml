name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk jq

      - name: Build playlist (manual preserved + all countries grouped)
        run: |
          set -e
          export LC_ALL=C

          PLAYLIST="playlists/all-channels.m3u"
          MANUAL_FILE="playlists/manual-urls.txt"
          OLD_PLAYLIST="playlists/all-channels.old.m3u"

          MANUAL_START="# === MANUAL CHANNELS (PRESERVED) START ==="
          MANUAL_END="# === MANUAL CHANNELS (PRESERVED) END ==="
          AUTO_MARKER="# === AUTO-GENERATED CHANNELS (DO NOT EDIT BELOW) ==="

          TMP_ALL="all_countries.tmp"
          TMP_AUTO="auto.tmp"
          TMP_FINAL="final.tmp"

          mkdir -p playlists

          if [ ! -f "$MANUAL_FILE" ]; then
            echo "ERROR: $MANUAL_FILE not found"
            exit 1
          fi

          if [ -f "$PLAYLIST" ]; then
            cp "$PLAYLIST" "$OLD_PLAYLIST"
          else
            touch "$OLD_PLAYLIST"
          fi

          # Fetch list of all countries from iptv-org
          curl -fsSL https://iptv-org.github.io/api/countries.json -o countries.json

          # Extract ISO codes
          jq -r '.[].code' countries.json | sort > country_codes.txt

          > "$TMP_ALL"

          # Fetch each country playlist
          while read code; do
            echo "Fetching $code..."
            curl -fsSL "https://iptv-org.github.io/iptv/countries/${code}.m3u" \
              | grep -vi '^#extm3u' \
              >> "$TMP_ALL" || true
          done < country_codes.txt

          # Group cleanly by country using country code inferred from file order
          gawk '
          function trim(s) {
            gsub(/^[ \t]+|[ \t]+$/, "", s)
            return s
          }

          BEGIN {
            PROCINFO["sorted_in"] = "@ind_str_asc"
          }

          /^#EXTINF/ {
            extinf_line = $0

            if (!match($0, /,([^,]+)$/, nm)) next
            channel_name = nm[1]

            country="XX"
            if (match($0, /tvg-country="([^"]+)"/, c))
              country = toupper(c[1])

            if (getline url <= 0) next
            url = trim(url)

            if (url=="" || url !~ /^https?:\/\//) next

            key = country "|" channel_name
            ext[key] = extinf_line
            link[key] = url
          }

          END {
            current=""
            for (k in ext) {
              split(k,a,"|")
              cc=a[1]

              if (cc!=current) {
                print ""
                print "## " cc
                current=cc
              }

              print ext[k]
              print link[k]
            }
          }
          ' "$TMP_ALL" > "$TMP_AUTO"

          {
            echo "#EXTM3U"
            echo
            echo "$MANUAL_START"
            cat "$MANUAL_FILE"
            echo "$MANUAL_END"
            echo
            echo "$AUTO_MARKER"
            cat "$TMP_AUTO"
          } > "$TMP_FINAL"

          mv "$TMP_FINAL" "$PLAYLIST"

          rm -f "$TMP_ALL" "$TMP_AUTO" countries.json country_codes.txt

      - name: Update README with Added / Removed / Updated channels
        run: |
          set -e
          export LC_ALL=C

          README="README.md"
          OLD="playlists/all-channels.old.m3u"
          NEW="playlists/all-channels.m3u"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          extract_map() {
            gawk '
            /^#EXTINF/ {
              if (!match($0, /,([^,]+)$/, nm)) next
              ch=nm[1]
              if (getline u <= 0) next
              gsub(/^[ \t]+|[ \t]+$/, "", u)
              if (u=="" || u !~ /^https?:\/\//) next
              print ch "|" u
            }' "$1" | sort -u
          }

          extract_map "$OLD" > old.map
          extract_map "$NEW" > new.map

          ADDED=$(comm -13 \
            <(cut -d"|" -f1 old.map | sort -u) \
            <(cut -d"|" -f1 new.map | sort -u))

          REMOVED=$(comm -23 \
            <(cut -d"|" -f1 old.map | sort -u) \
            <(cut -d"|" -f1 new.map | sort -u))

          UPDATED=$(
            join -t"|" \
              <(sort old.map) \
              <(sort new.map) \
            | gawk -F"|" '$2 != $3 { print $1 }'
          )

          {
            echo "# IPTV Playlist"
            echo
            echo "## 📡 Auto Playlist Update Overview"
            echo
            echo "Last Updated: $TIMESTAMP"
            echo
            echo "### Channels Added"
            [ -n "$ADDED" ] && echo "$ADDED" | sed 's/^/- /' || echo "- None"
            echo
            echo "### Channels Removed"
            [ -n "$REMOVED" ] && echo "$REMOVED" | sed 's/^/- /' || echo "- None"
            echo
            echo "### Channels Updated (Link Changed)"
            [ -n "$UPDATED" ] && echo "$UPDATED" | sed 's/^/- /' || echo "- None"
          } > "$README"

          rm -f old.map new.map

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add playlists/all-channels.m3u README.md
          git diff --cached --quiet && exit 0

          git commit -m "Auto-update IPTV playlist using all country playlists"
          git push
