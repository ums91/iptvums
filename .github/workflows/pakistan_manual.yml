name: Build Pakistan IPTV (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install requests

      - run: python scripts/build_pakistan.py

      - name: Commit playlist
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlists/pakistan_full.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Manual Pakistan playlist update"
          git push
